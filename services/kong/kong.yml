_format_version: "3.0"

upstreams:
  - name: fastapi-upstream
    targets:
      - target: api-fastapi:8000
        weight: 100
    healthchecks:
      passive:
        type: http
        healthy:
          http_statuses: [200, 201, 202, 204]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2

  - name: go-upstream
    targets:
      - target: api-go:8080
        weight: 100
    healthchecks:
      passive:
        type: http
        healthy:
          http_statuses: [200, 201, 202, 204]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2

  - name: legacy-upstream
    targets:
      - target: legacy-service:8000
        weight: 100

services:
  - name: fastapi-service
    host: fastapi-upstream
    protocol: http
    port: 8000
    connect_timeout: 60000
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      - name: fastapi-api-route
        paths:
          - /api/v1/fastapi
        strip_path: true
      - name: fastapi-ws-route
        paths:
          - /ws
        strip_path: false
        protocols:
          - http
          - https

  - name: go-service
    host: go-upstream
    protocol: http
    port: 8080
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: go-api-route
        paths:
          - /api/v1/go
        strip_path: true

  - name: legacy-service
    host: legacy-upstream
    protocol: http
    port: 8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: legacy-api-route
        paths:
          - /api/v1/legacy
        strip_path: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
        - PATCH
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - X-Correlation-ID
        - X-User-Id
      exposed_headers:
        - X-Correlation-ID
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 200
      policy: local
      fault_tolerant: true
      hide_client_headers: false
