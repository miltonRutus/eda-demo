version: "3.8"

networks:
  eda-network:
    name: eda-network
    driver: bridge

volumes:
  rabbitmq_data:
    name: eda_rabbitmq_data

services:
  # ============================================================================
  # RabbitMQ Message Broker (Topic Exchange & Dead Letter Exchange)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eda-rabbitmq
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./services/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./services/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eda-network

  # ============================================================================
  # Kong API Gateway (Ingress, Auth Offloading, Reverse Proxy & WebSockets)
  # ============================================================================
  kong:
    image: kong:3.6
    container_name: eda-kong
    hostname: kong
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./services/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - eda-network

  # ============================================================================
  # API 3: Servicio Legacy (Emisor de Compras - Fire & Forget)
  # ============================================================================
  legacy-service:
    build:
      context: ./services/legacy-service
      target: dev
    container_name: eda-legacy-service
    hostname: legacy-service
    ports:
      - "${LEGACY_DEV_PORT:-8003}:8000"
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - ./services/legacy-service/src:/app/src
      - ./services/legacy-service/tests:/app/tests
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eda-network

  # ============================================================================
  # API 2: Golang Service (Inventario y Facturación Concurrente)
  # ============================================================================
  api-go:
    build:
      context: ./services/api-go
      target: dev
    container_name: eda-api-go
    hostname: api-go
    ports:
      - "${GO_DEV_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - ./services/api-go:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eda-network

  # ============================================================================
  # API 1: Python FastAPI (Orquestación, Fidelidad y Servidor WebSockets)
  # ============================================================================
  api-fastapi:
    build:
      context: ./services/api-fastapi
      target: dev
    container_name: eda-api-fastapi
    hostname: api-fastapi
    ports:
      - "${FASTAPI_DEV_PORT:-8002}:8000"
    environment:
      - PORT=8000
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - ./services/api-fastapi/src:/app/src
      - ./services/api-fastapi/tests:/app/tests
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eda-network

  # ============================================================================
  # Frontend: Single Page Application (Vue.js 3, Vite & Vuetify)
  # ============================================================================
  frontend-vue:
    build:
      context: ./services/frontend-vue
      target: dev
    container_name: eda-frontend-vue
    hostname: frontend-vue
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./services/frontend-vue:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - kong
      - api-fastapi
    networks:
      - eda-network

